<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkQueue - Login & Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Log&Register.css">
</head>
<body>
    <div class="container">
        <!-- Form Container -->
        <div class="form-container" id="formContainer">
            <!-- Login Form -->
            <div class="form-content" id="loginForm">
                <div class="logo-small">
                    <img src="../../img/logo.png" alt="" height="40px" width="40px">
                    <span>ParkQueue</span>
                </div>

                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="Enter your Email">
                    <span class="icon"><i class="bi bi-envelope"></i></span>
                </div>

                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Enter your Password">
                    <span class="icon" onclick="togglePassword('loginPassword')">
                        <i class="bi bi-eye" id="loginPasswordIcon"></i>
                    </span>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword()">Forgot Password?</a>
                </div>

                <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Login</button>

                <div class="link-text">
                    Don't Have an Account? <a href="#" onclick="switchToRegister(event)">Register Here</a>
                </div>

                <div class="divider">OR</div>

                <button class="social-btn google" onclick="handleGoogleLogin()">
                    <span>G</span> Log in with Google
                </button>

                <button class="social-btn facebook" disabled>
                    <span>f</span> Log in with Facebook
                </button>
            </div>

            <!-- Register Form -->
            <div class="form-content" id="registerForm" style="display: none;">
                <div class="acc-reg">
                    <span class="acc-text">Account Registration</span>
                </div>
                <div class="input-group">
                    <input type="email" id="registerEmail" placeholder="Enter your Email">
                    <span class="icon"><i class="bi bi-envelope"></i></span>
                </div>

                <div class="input-group">
                    <input type="text" id="registerUsername" placeholder="Enter your Username">
                    <span class="icon"><i class="bi bi-person"></i></span>
                </div>

                <div class="input-group">
                    <input type="password" id="registerPassword" placeholder="Enter Your Password">
                    <span class="icon" onclick="togglePassword('registerPassword')">
                        <i class="bi bi-eye" id="registerPasswordIcon"></i>
                    </span>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                    <span class="icon" onclick="togglePassword('confirmPassword')">
                        <i class="bi bi-eye" id="confirmPasswordIcon"></i>
                    </span>
                </div>

                <button class="btn-primary" onclick="handleRegistration()">Send Verification Code</button>

                <div class="link-text">
                    Already have an Account? <a href="#" onclick="switchToLogin(event)">Login Here</a>
                </div>

                <div class="divider">OR</div>

                <button class="social-btn google" onclick="handleGoogleLogin()">
                    <span>G</span> Sign up with Google
                </button>

                <button class="social-btn facebook" disabled>
                    <span>f</span> Sign up with Facebook
                </button>
            </div>
        </div>

        <!-- Image Container -->
        <div class="image-container" id="imageContainer">
            <img src="../../img/motorbg.jpg" alt="Motorcycle" class="bike-image">
            <div class="logo-overlay">
                <div class="logo-text">Park<br>Queue</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script type="module" src="firebase.js"></script>
    <script src="Login&Register.js"></script>
    <script>
        // Check if mobile device
        function isMobileDevice() {
            return window.innerWidth <= 768;
        }

        // Modified switch functions for mobile
        function switchToRegister(e) {
            e.preventDefault();
            clearAllErrors();
            
            if (isMobileDevice()) {
                // Mobile: vertical sliding
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');
                
                // Slide form down and image up
                formContainer.classList.add('slide-down');
                imageContainer.classList.add('slide-up');
                
                // Switch forms after animation
                setTimeout(() => {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    // Reverse positions for next switch
                    formContainer.style.order = '2';
                    imageContainer.style.order = '1';
                }, 400);
            } else {
                // Desktop: horizontal sliding
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');
                
                formContainer.classList.add('slide-right');
                imageContainer.classList.add('slide-left');
                
                setTimeout(() => {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                }, 400);
            }
        }

        function switchToLogin(e) {
            e.preventDefault();
            clearAllErrors();
            
            if (isMobileDevice()) {
                // Mobile: vertical sliding
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');
                
                // Remove slide classes for animation
                formContainer.classList.remove('slide-down');
                imageContainer.classList.remove('slide-up');
                
                // Switch forms after animation
                setTimeout(() => {
                    registerForm.style.display = 'none';
                    loginForm.style.display = 'block';
                    // Restore original order
                    formContainer.style.order = '1';
                    imageContainer.style.order = '2';
                }, 400);
            } else {
                // Desktop: horizontal sliding
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');
                
                formContainer.classList.remove('slide-right');
                imageContainer.classList.remove('slide-left');
                
                setTimeout(() => {
                    registerForm.style.display = 'none';
                    loginForm.style.display = 'block';
                }, 400);
            }
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            if (!isMobileDevice()) {
                // Reset mobile styles when going back to desktop
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                
                formContainer.classList.remove('slide-down', 'slide-up');
                imageContainer.classList.remove('slide-down', 'slide-up');
                formContainer.style.order = '';
                imageContainer.style.order = '';
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (isMobileDevice()) {
                // Set initial order for mobile
                const formContainer = document.querySelector('.form-container');
                const imageContainer = document.querySelector('.image-container');
                formContainer.style.order = '1';
                imageContainer.style.order = '2';
            }
            
            // Enter key support
            document.getElementById('loginPassword')?.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });

            document.getElementById('registerPassword')?.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    handleRegistration();
                }
            });

            document.getElementById('confirmPassword')?.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    handleRegistration();
                }
            });

            // Auto-focus first input
            const loginEmail = document.getElementById('loginEmail');
            if (loginEmail) loginEmail.focus();

            // Loading state for login button
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.addEventListener('click', function () {
                    this.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Logging in...';
                    this.disabled = true;
                });
            }
        });

        // Forgot password handler
        async function handleForgotPassword() {
            const email = document.getElementById('loginEmail')?.value || prompt('Please enter your email address:');
            if (email) {
                try {
                    await resetPassword(email);
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }

        // Add CSS for loading spinner
        const style = document.createElement('style');
        style.textContent = `
            .spin {
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .social-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            .social-btn:disabled:hover {
                transform: none;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
